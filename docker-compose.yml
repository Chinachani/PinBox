services:
  lcsc-stock-mobile:
    image: ${PINBOX_IMAGE:-pinbox:local}
    build: .
    container_name: lcsc-stock-mobile
    restart: always
    ports:
      - "8088:8088"
      - "8089:8089"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - ./package.json:/app/package.json:ro
    command: ["python", "backend/main.py"]
    environment:
      - TZ=Asia/Shanghai
      - PINBOX_API_TOKEN=${PINBOX_API_TOKEN:-}
      - PINBOX_ALLOWED_ORIGINS=${PINBOX_ALLOWED_ORIGINS:-}
