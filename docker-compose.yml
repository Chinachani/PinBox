version: '3.8'

services:
  lcsc-stock-mobile:
    build: .
    container_name: lcsc-stock-mobile
    restart: always
    ports:
      - "8088:8088"
      - "8089:8089"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./package.json:/app/package.json:ro
    command: ["python", "backend/main.py"]
    environment:
      - TZ=Asia/Shanghai
