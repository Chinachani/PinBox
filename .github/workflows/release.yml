name: PinBox Multi-Platform Auto Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. 编译 Windows 独立版程序 (PinBox.exe)
  # =========================================================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Standalone Windows EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "PinBox" `
            --icon "frontend/icons/icon-512.png" `
            --add-data "frontend;frontend" `
            --hidden-import "uvicorn" `
            --hidden-import "fastapi" `
            --hidden-import "openpyxl" `
            --hidden-import "xlrd" `
            --hidden-import "zxingcpp" `
            --hidden-import "PIL" `
            backend/main.py

      - name: Archive Windows Artifact
        run: |
          Compress-Archive -Path dist/PinBox/* -DestinationPath dist/PinBox-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinBox-Windows-x64
          path: dist/PinBox-Windows-x64.zip

  # =========================================================================
  # 2. 编译 Linux 原生通用安装包 (pinbox_1.0.0_amd64.deb)
  # =========================================================================
  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "pinbox" \
            --add-data "frontend:frontend" \
            --hidden-import "uvicorn" \
            --hidden-import "fastapi" \
            --hidden-import "openpyxl" \
            --hidden-import "xlrd" \
            --hidden-import "zxingcpp" \
            --hidden-import "PIL" \
            backend/main.py

      - name: Read Version
        id: ver
        run: echo "v=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Package Debian (.deb)
        run: |
          mkdir -p deb-pkg/opt/pinbox deb-pkg/usr/bin deb-pkg/usr/share/applications deb-pkg/usr/share/icons/hicolor/192x192/apps deb-pkg/DEBIAN
          cp -r dist/pinbox/* deb-pkg/opt/pinbox/
          cp frontend/icons/icon-192.png deb-pkg/usr/share/icons/hicolor/192x192/apps/pinbox.png

          cat << 'EOF' > deb-pkg/usr/bin/pinbox
          #!/bin/bash
          cd /opt/pinbox && exec ./pinbox "$@"
          EOF
          chmod +x deb-pkg/usr/bin/pinbox

          cat << 'EOF' > deb-pkg/usr/share/applications/pinbox.desktop
          [Desktop Entry]
          Name=PinBox 引脚仓
          Comment=PinBox 元器件库位与BOM管理系统
          Exec=/usr/bin/pinbox
          Icon=pinbox
          Terminal=false
          Type=Application
          Categories=Development;Electronics;Utility;
          EOF

          cat << 'EOF' > deb-pkg/DEBIAN/control
          Package: pinbox
          Version: ${{ steps.ver.outputs.v }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Chinachani
          Description: PinBox - Smart Electronics Inventory & BOM Manager
          EOF

          dpkg-deb --build deb-pkg dist/pinbox_${{ steps.ver.outputs.v }}_amd64.deb

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinBox-Linux-deb
          path: dist/pinbox_${{ steps.ver.outputs.v }}_amd64.deb

  # =========================================================================
  # 3. 编译 Android 原生单机安装包 (PinBox.apk)
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Sync Web Assets
        run: |
          npm install
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Read Version (Android)
        id: ver
        run: echo "v=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Rename and Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/PinBox-v${{ steps.ver.outputs.v }}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinBox-Android-APK
          path: dist/PinBox-v${{ steps.ver.outputs.v }}.apk

  # =========================================================================
  # 4. 发布 GitHub Release（当推送 v* Tag 或手动触发时）
  # =========================================================================
  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PinBox-Windows-x64
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: PinBox-Linux-deb
          path: release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: PinBox-Android-APK
          path: release-assets

      - name: Compute Release Tag
        id: reltag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Release 版本号与产品版本号（package.json）严格同步，不再自动 +1。
            # 发版前先 bump package.json；同版本重复推送时 action-gh-release 会原地更新 Release 资产。
            VER=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Changelog from Commits
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 上一个正式 release 的 tag 之后的所有 commit（排除 ci: 提交）
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          LOG=$(git log "$RANGE" --pretty=format:"- %s (%h)" | grep -v '^\- ci:' | head -30 || true)
          if [ -z "$LOG" ]; then
            LOG="- 常规维护与依赖更新"
          fi
          {
            echo "log<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: "PinBox 引脚仓 ${{ steps.reltag.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## 📦 自动发布

            ${{ steps.changelog.outputs.log }}

            **安装包说明**
            - `PinBox-*.apk` — Android 原生客户端（系统 WebView 渲染，包体小是正常特性）
            - `PinBox-Windows-x64.zip` — Windows 绿色版
            - `pinbox_*_amd64.deb` — Linux Debian/Ubuntu 安装包
          generate_release_notes: false
          files: |
            release-assets/PinBox-Windows-x64.zip
            release-assets/pinbox_*_amd64.deb
            release-assets/PinBox-v*.apk
